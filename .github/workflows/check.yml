name: Check Nix Flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Set up dummy secrets
        run: make setup-dummy-secrets
      - name: Check Nix flake
        run: make check
      - name: Run offline DNSControl IR checks
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.dns-render \
            .#checks.x86_64-linux.dns-config \
            .#checks.x86_64-linux.dns-app-safety
      - name: Check formatting
        run: nix develop --command nixfmt --check $(find . -name '*.nix' | tr '\n' ' ')
